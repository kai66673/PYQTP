[project]
name = "pyqtp-ws-ide"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "build-kddw>=0.1.0; sys_platform == 'linux'",
    "mypy>=2.3.1",
]

[tool.uv.sources]
pyqtp-common = { workspace = true }
pyqtp-core = { workspace = true }
pyqtp-ide = { workspace = true }
build-kddw = { path = "whl/build_kddw-0.1.0-cp311-cp311-linux_x86_64.whl" }

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.pyright]
reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportIncompatibleVariableOverride = false
typeCheckingMode = "standard"

[tool.uv.workspace]
members = [
  "packages/pyqtp-common",
  "packages/pyqtp-core",
  "packages/pyqtp-ide",
  "packages/qtmonaco",
]
