[project]
name = "pyqtp-ws-ide"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "build-kddw>=0.1.0; sys_platform == 'linux'",
    "mypy>=2.3.1",
]

[tool.uv.sources]
pyqtp-common = { workspace = true }
pyqtp-core = { workspace = true }
pyqtp-ide = { workspace = true }
build-kddw = { path = "whl/build_kddw-0.1.0-cp311-cp311-linux_x86_64.whl" }

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.pyright]
reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportIncompatibleVariableOverride = false
typeCheckingMode = "standard"

[tool.pytest.ini_options]
# Тесты — в каталогах tests пакетов; vendored packages/qtmonaco/tests не собираем.
testpaths = [
    "packages/pyqtp-core/tests",
    "packages/pyqtp-ide/tests",
]
markers = [
    "live: требует живых внешних процессов (LSP-серверы), по умолчанию выключен",
    "webengine: требует QWebEngineView (реальный редактор Monaco), по умолчанию выключен",
]
addopts = [
    "-m", "not live and not webengine",
    # testpaths применяются только при запуске из корня репозитория; эти маски
    # отсекают тесты вендоренного qtmonaco при запуске из любой директории
    # (--ignore-glob сопоставляется с относительным путём, поэтому нужно
    # и «глубокий», и «верхнеуровневый» варианты)
    "--ignore-glob=*/qtmonaco/tests/*",
    "--ignore-glob=qtmonaco/tests/*",
]

[tool.uv.workspace]
members = [
  "packages/pyqtp-common",
  "packages/pyqtp-core",
  "packages/pyqtp-ide",
  "packages/qtmonaco",
]
