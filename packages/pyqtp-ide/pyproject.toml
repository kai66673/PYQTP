[project]
name = "pyqtp_ide"
version = "1.0.0"
description = "PySide6 Desktop IDE Application"
authors = [{ name = "ЛИТМ МФТИ", email = "itpm@mipt.ru" }]
requires-python = "~=3.11.0"
readme = "README.md"
dependencies = [
    "pyside6>=6.6.2,<7",
    "qtmonaco",
    "basedpyright",
    "websockets",
    # LSP-сервер стека python (этап 3.1): `ruff server` (stdio)
    "ruff",
]

[tool.uv.sources]
qtmonaco = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "sphinx",
    "sphinx-pyproject",
    "sphinx-rtd-theme",
    "watchdog",
    "pre-commit",
    "pydoclint",
    "commitizen",
    "pyright",
    "msgpack-types",
]

[tool.hatch.build.targets.sdist]
include = ["pyqtp"]

[tool.hatch.build.targets.wheel]
include = ["pyqtp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["pyqtp", "tests"]
reportIncompatibleVariableOverride = false

[tool.ruff]
include = ["pyproject.toml", "pyqtp/**/*.py"]
exclude = [
    "pyqtp/help/**/*_rc.py",
]
line-length = 80
fix = true

[tool.ruff.lint]
select = [
    "ALL"
]
ignore = [
    "CPY001",
    #### modules
    "ANN",  # flake8-annotations
    "COM",  # flake8-commas
    "C90",  # mccabe complexity
    "DJ",   # django
    "EXE",  # flake8-executable
    "TID",  # flake8-tidy-imports
    "S101", # flake8-bandit
    #### specific rules
    "D100",   # ignore missing docs
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D200",
    "D205",
    "D212",
    "D400",
    "D401",
    "D415",
    "E402",    # false positives for local imports
    "E501",    # line too long
    "TRY003",  # external messages in exceptions are too verbose
    "TD002",
    "TD003",
    "FIX002",  # too verbose descriptions of todos

    "RUF001",  # String contains ambiguous...
    "RUF002",  # ambigous unicode
    "RUF003",  # Comment contains ambiguous...
    "D211",    # no blankline before class
    "INP001",  # no __init__.py
    "SLF001",  # Private member accessed

    # Правила, несовместимые с правилом форматтера quote-style = "single"
    "ISC001",
    "Q000",
    "Q003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "SLF001",  # private attributes
    "T201",    # print usage
    "S106"     # possible hardcoded password
]

[tool.ruff.lint.isort]
known-first-party = ["pyqtp*"]

[tool.ruff.format]
# 5. Use single quotes for non-triple-quoted strings.
quote-style = "single"

[tool.ruff.lint.pep8-naming]
# PyQt methods
ignore-names = [
    "closeEvent",
    "paintEvent",
    "keyPressEvent",
    "mousePressEvent",
    "mouseMoveEvent",
    "mouseReleaseEvent",
    "headerData",
    "setData",
    "rowCount",
    "columnCount",
    "boundingRect",
    "mouseDoubleClickEvent",
    "itemChange",
    "hoverEnterEvent",
    "wheelEvent",
    "dragMoveEvent",
    "dragEnterEvent",
    "dropEvent",
    "hoverLeaveEvent",
    "focusInEvent",
    "focusOutEvent",
    "lessThan",
    "sizeHint",
    "editorEvent",
    "closeEditor",
    "javaScriptConsoleMessage",
    "enterEvent",
    "leaveEvent",
    "createEditor",
    "setEditorData",
    "setModelData",
    "updateEditorGeometry",
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Accepts: "google", "numpy", or "pep257".

[tool.sphinx-pyproject]
author = "ЛИТПМ МФТИ"
language = "ru"
package_root = "sphinx_pyproject"
extensions = [
    "sphinx.ext.autodoc",
    "sphinx.ext.autosummary",
    "sphinx.ext.napoleon",
    "sphinx.ext.todo",
    "sphinx.ext.viewcode"
]
napoleon_google_docstring = true
autodoc_typehints = "description"
html_theme = "sphinx_rtd_theme"
